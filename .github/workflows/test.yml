name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install "langchain>=0.3.0" "langchain-openai>=0.2.0" "python-dotenv>=1.0.0"
          pip install --no-deps "langchain-nti>=0.1.1"
      - name: Verify imports
        run: python -c "import langchain_nti; print('NTI wrapper loaded')"
