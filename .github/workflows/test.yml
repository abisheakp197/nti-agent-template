name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy --strict agent.py tests/test_agent.py
      - name: Run Tests
        run: pytest
      - name: Verify imports
        run: |
          python -c "import langchain_nti; print('NTI loaded')"
          python -c "import agent; print('Agent loaded')"
